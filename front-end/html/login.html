<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../imagens/favicon.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../css/login.css" />
    <title>Login LevelNext Games</title>
  </head>
  <body>
    <nav class="migalhas" aria-label="Trilha de navegação">
      <ol><li><a href="index.html">Início</a></li><li aria-current="page">Login</li></ol>
    </nav>
    <div class="login">
      <h1>Login</h1>
      <form id="login-form">
        <fieldset>
          <h2 class="titulo-fieldset">Dados Cadastrais:</h2>
          <input
            type="email"
            id="email"
            name="email"
            aria-label="E-mail"
            title="Digite um e-mail válido."
            placeholder="nome@exemplo.com"
            required
          />
          <input
            type="password"
            id="senha"
            name="senha"
            aria-label="Senha"
            placeholder="ex:joao123$"
            required
          />
          <button type="submit" id="botao">Entrar</button>
        </fieldset>
      </form>
      <p class="form-feedback" id="login-feedback" role="status" aria-live="polite"></p>
      <a href="cadastro.html" id="link">Não tenho uma conta</a>
    </div>
    <script src="../js/login.js" defer></script>
  </body>
</html>
