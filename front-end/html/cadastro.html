<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../imagens/favicon.ico"
      type="image/x-icon"
    />
    <title>Cadastro LevelNext Games</title>
    <link rel="stylesheet" href="../js/vendor/flatpickr/flatpickr.min.css" />
    <link rel="stylesheet" href="../css/cadastro.css" />
  </head>
  <body>
    <nav class="migalhas" aria-label="Trilha de navegação">
      <ol><li><a href="index.html">Início</a></li><li aria-current="page">Cadastro</li></ol>
    </nav>
    <div class="cadastro">
      <h1>Cadastro</h1>
      <form id="cadastro-form">
        <fieldset>
          <h2 class="titulo-fieldset">Dados Pessoais</h2>
          <input
            type="text"
            id="nome"
            name="nome"
            aria-label="Nome completo"
            pattern="[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .'-]*"
            title="Digite um nome válido."
            placeholder="ex:João Santos"
            required
          />
          <input
            type="text"
            id="datanascimento"
            name="datanascimento"
            aria-label="Data de nascimento"
            pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}"
            title="Digite a data no formato dd/mm/aaaa."
            placeholder="dd/mm/aaaa"
            inputmode="numeric"
            required
          />
        </fieldset>
        <fieldset>
          <h2 class="titulo-fieldset">Dados Cadastrais</h2>
          <input
            type="email"
            id="email"
            name="email"
            aria-label="E-mail"
            title="Digite um e-mail válido."
            placeholder="nome@exemplo.com"
            required
          />
          <input
            type="password"
            id="senha"
            name="senha"
            aria-label="Senha"
            pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
            title="Use de 8 a 72 caracteres, uma letra, um número e um caractere especial."
            placeholder="ex:joao123$"
            required
          />
          <input
            type="password"
            id="confirmsenha"
            name="confirmsenha"
            aria-label="Confirme a senha"
            pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
            title="Digite a mesma senha do campo anterior."
            placeholder="Confirmar Senha"
            required
          />
          <button type="submit" id="botao">Cadastrar</button>
        </fieldset>
      </form>
      <p class="form-feedback" id="cadastro-feedback" role="status" aria-live="polite"></p>
      <a href="login.html" id="link">Já tenho uma conta</a>
    </div>
    <script src="../js/vendor/flatpickr/flatpickr.min.js"></script>
    <script src="../js/vendor/flatpickr/pt.js"></script>
    <script src="../js/cadastro.js" defer></script>
  </body>
</html>
