<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../imagens/favicon.ico"
      type="image/x-icon"
    />
    <title>Login LevelNext Games</title>
  </head>
  <body>
    <h1>Login</h1>
    <div class="login">
      <form action="processar_login.js" method="post" onsubmit="return confirm('os dados estão corretos?');">
        <fieldset>
          <legend>Dados Cadastrais:</legend>
        <input
          type="text"
          id="email"
          name="email"
          placeholder="exemplo@gmail.com"
          required
        />
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="ex:joao123$"
          required
        />
        <button type="submit">Entrar</button>
        </fieldset>
      </form>
      <a href="cadastro.html">Não tenho uma conta</a>
    </div>
  </body>
</html>
