<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="../imagens/favicon.ico"
      type="image/x-icon"
    />
    <title>Cadastro LevelNext Games</title>
  </head>
  <body>
    <h1>Cadastro</h1>
    <div class="cadastro">
      <form onsubmit="return confirm('Os dados estão corretos?');">
        <input
          type="text"
          id="nome"
          name="nome"
          pattern="[A-Za-zÁ-ÿ]+"
          title="Digite apenas letras"
          placeholder="ex:João Santos"
          required
        />
        <input
          type="email"
          id="email"
          name="email"
          pattern="[a-zA-Z0-9._%+-]+@gmail\.com"
          title="Digite o e-mail de forma correta"
          placeholder="exemplo@gmail.com"
          required
        />
        <input 
          type="password"
          id="senha"
          name="senha"
          pattern="(?=.*[A-Za-z])(?=.*[0-9])(.*[^A-Za-z0-9]).{8,}"
          title="A senha deve conter pelo menos  caracteres, uma letra, um número e um caractere especial."
          placeholder="ex:joao123$"
          required 
        />
        <input
          type="password"
          id="senha"
          name="senha"
          pattern="(?=.*[A-Za-z])(?=.*[0-9])(.*[^A-Za-z0-9]).{8,}"
          title="A senha deve conter pelo menos  caracteres, uma letra, um número e um caractere especial."
          placeholder="Confirmar Senha"
          required
        />
        <input
          type="date"
          id="datanascimento"
          name="datanascimento"
          placeholder="Data de Nascimento"
          required
        />
        <button type="submit">Cadastrar</button>
      </form>
      <a href="login.html">Já tenho uma conta</a>
    </div>
  </body>
</html>
