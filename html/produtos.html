<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css">
    <title>Produtos LevelNext Games</title>
</head>
<body>
  <main class="inicio">
    <nav class="migalhas" aria-label="Trilha de navegação">
      <ol><li><a href="index.html">Início</a></li><li aria-current="page">Produtos</li></ol>
    </nav>
    <h1>Produtos em destaque</h1>
    <aside>
      <label for="categoria">Categorias:</label>
      <select name="categoria" id="categoria">
        <option value="perifericos">Periféricos</option>
        <option value="monitores">Monitores</option>
        <option value="hardware">Hardware</option>
        <option value="notebook">Notebooks</option>
      </select>
    </aside>
    <form class="pesquisa" action="produtos.html" method="get">
      <label for="pesquisa">Pesquisar Produtos:</label>
      <input
        type="search"
        id="pesquisa"
        name="pesquisa"
        placeholder="Ex:Mouse"
        required
      />
      <button type="submit">Pesquisar</button>
    </form>
  </main>
</body>
</html>
